[workspace]
resolver = "3"
members = [
    "crates/lg-types",
    "crates/lg-manifests",
    "crates/lg-workflow",
    "crates/lg-hwprobe",
    "crates/lg-modelscan",
    "crates/lg-planner",
    "crates/lg-downloader",
    "crates/lg-store",
    "crates/lg-imageops",
    "crates/lg-engine",
    "crates/lg-fakecomfy",
    "crates/lg-server",
]
# The Tauri shell needs WebView2 (Windows) or webkit2gtk (Linux), so it is built separately.
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
lg-types = { path = "crates/lg-types" }
lg-manifests = { path = "crates/lg-manifests" }
lg-workflow = { path = "crates/lg-workflow" }
lg-hwprobe = { path = "crates/lg-hwprobe" }
lg-modelscan = { path = "crates/lg-modelscan" }
lg-planner = { path = "crates/lg-planner" }
lg-downloader = { path = "crates/lg-downloader" }
lg-store = { path = "crates/lg-store" }
lg-imageops = { path = "crates/lg-imageops" }
lg-engine = { path = "crates/lg-engine" }
lg-fakecomfy = { path = "crates/lg-fakecomfy" }
lg-server = { path = "crates/lg-server" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws", "multipart"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart", "rustls-tls"] }
tokio-tungstenite = "0.27"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
sysinfo = "0.37"
notify = "8"
jsonschema = { version = "0.33", default-features = false }
sha2 = "0.10"
hex = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.9"
tempfile = "3"
parking_lot = "0.12"
bytes = "1"
base64 = "0.22"
mime_guess = "2"
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3

[profile.dev.package."*"]
opt-level = 1
