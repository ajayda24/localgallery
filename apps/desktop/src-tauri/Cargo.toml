[package]
name = "localgallery"
description = "LocalGallery desktop window. The core runs in-process; this crate only hosts the WebView."
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[[bin]]
name = "LocalGallery"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
lg-server = { path = "../../../crates/lg-server" }
tauri = { version = "2.12.5", features = [] }
tauri-plugin-single-instance = "2.5.4"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
panic = "abort"

[profile.dev.package."*"]
opt-level = 1
